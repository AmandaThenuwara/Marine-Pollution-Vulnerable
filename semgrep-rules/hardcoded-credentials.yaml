rules:
  - id: marine-hardcoded-default-credentials
    languages:
      - javascript
    severity: ERROR
    message: >-
      Privileged account is seeded with hardcoded
      credentials. Use securely configured credentials
      and require rotation of existing defaults.
    patterns:
      - pattern: |
          User.create({
            ...,
            password: $PASSWORD,
            role: $ROLE,
            ...
          })
      - metavariable-regex:
          metavariable: $PASSWORD
          regex: "^['\"].+['\"]$"
      - metavariable-regex:
          metavariable: $ROLE
          regex: "^['\"](admin|Cleanup_Task_Manager)['\"]$"
